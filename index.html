<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3-2-1</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- =====================================================
         ANA SAYFA
    ====================================================== -->

    <div id="home-screen">

        <h1>3-2-1</h1>

        <p class="home-subtitle">
            İki takım arasındaki ortak futbolcuyu bul!
        </p>

        <button
            id="start-button"
            aria-label="Oyuna Başla"
        >
            OYUNA BAŞLA
        </button>

    </div>



    <!-- =====================================================
         OYUN EKRANI
    ====================================================== -->

    <div id="game-content">


        <!-- =================================================
             BAŞLIK
        ================================================== -->

        <header class="game-header">

            <h1>
                ORTAK FUTBOLCU
            </h1>

            <div
                class="score"
                id="score"
            >
                Puan: 0
            </div>

            <div id="question-number">
                Soru: 0 / 10
            </div>

        </header>



        <!-- =================================================
             SÜRE BARI
        ================================================== -->

        <div class="timer-container">

            <div id="timer-bar"></div>

        </div>



        <!-- =================================================
             OYUN ALANI
        ================================================== -->

        <div class="game-area">


            <!-- 1. TAKIM -->

            <div
                class="team"
                id="team1"
            >

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        id="team1-logo"
                        src=""
                        alt=""
                    >

                </div>

                <span
                    class="team-name"
                    id="team1-name"
                ></span>

            </div>



            <!-- ORTA -->

            <div class="vs">

                <div id="countdown"></div>

                <div id="vs-text">
                    VS
                </div>

            </div>



            <!-- 2. TAKIM -->

            <div
                class="team"
                id="team2"
            >

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        id="team2-logo"
                        src=""
                        alt=""
                    >

                </div>

                <span
                    class="team-name"
                    id="team2-name"
                ></span>

            </div>

        </div>



        <!-- =================================================
             CEVAP ALANI
        ================================================== -->

        <div class="answer-area">


            <div class="answer-input-wrapper">

                <input
                    type="text"
                    id="answerInput"
                    placeholder="Ortak futbolcuyu yaz"
                    autocomplete="off"
                    spellcheck="false"
                >

                <div id="player-suggestions"></div>

            </div>


            <button id="answerButton">
                CEVAPLA
            </button>

        </div>



        <!-- =================================================
             CEVAP SONUCU
        ================================================== -->

        <div
            id="result"
            aria-live="polite"
        ></div>


    </div>



    <!-- =====================================================
         OYUN BİTİŞ EKRANI
    ====================================================== -->

    <div
        id="game-over"
        class="game-over"
    >

        <div class="game-over-box">


            <div class="game-over-icon">
                🏆
            </div>


            <h2>
                OYUN BİTTİ
            </h2>


            <div class="final-score-label">
                FİNAL SKORU
            </div>


            <div id="final-score">
                0
            </div>


            <div id="final-message">
                10 soruyu tamamladın!
            </div>


            <button id="restart-button">
                TEKRAR OYNA
            </button>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="players.js"></script>

    <script src="script.js"></script>


</body>

</html>
