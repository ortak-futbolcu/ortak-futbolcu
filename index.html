<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3-2-1 | Ortak Futbolcu</title>

    <style>

        /* =====================================================
           TEMEL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                #020705;

            color: #ffffff;

            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
        }


        /* =====================================================
           ANA SAYFA
        ===================================================== */

        #home-screen {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background:

                radial-gradient(
                    ellipse at center 42%,
                    rgba(45, 210, 115, 0.12),
                    transparent 35%
                ),

                radial-gradient(
                    ellipse at center bottom,
                    rgba(20, 100, 60, 0.20),
                    transparent 55%
                ),

                linear-gradient(
                    180deg,
                    #020705 0%,
                    #06140e 50%,
                    #081b12 100%
                );

            overflow: hidden;

            z-index: 1;
        }


        #home-screen::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    ellipse at 50% 18%,
                    rgba(255,255,255,0.055),
                    transparent 28%
                ),

                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.48),
                    transparent 24%,
                    transparent 76%,
                    rgba(0,0,0,0.48)
                );

            pointer-events: none;
        }


        #home-screen::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: -18%;

            transform: translateX(-50%);

            width: 85%;

            height: 48%;

            border-radius: 50%;

            background:

                radial-gradient(
                    ellipse,
                    rgba(49,220,120,0.16),
                    transparent 67%
                );

            filter: blur(14px);

            pointer-events: none;
        }


        /* =====================================================
           LOGO 321
        ===================================================== */

        #home-screen h1 {

            display: block;

            position: relative;

            z-index: 5;

            margin: -100px 0 0;

            font-size:
                clamp(100px, 15vw, 225px);

            line-height: 0.82;

            font-weight: 1000;

            font-style: italic;

            letter-spacing: -9px;

            background:

                linear-gradient(
                    100deg,
                    #ffffff 0%,
                    #f4f7f5 22%,
                    #5af39a 42%,
                    #27d879 52%,
                    #8af5b5 61%,
                    #ffffff 78%,
                    #f1f5f2 100%
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

            filter:
                drop-shadow(
                    0 8px 10px
                    rgba(0,0,0,0.55)
                )
                drop-shadow(
                    0 0 18px
                    rgba(49,220,120,0.18)
                );
        }


        #home-screen .home-subtitle {

            display: block;

            position: relative;

            z-index: 5;

            margin: 25px 0 0;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            color:
                rgba(235,255,243,0.72);

            text-shadow:
                0 2px 8px
                rgba(0,0,0,0.65);
        }


        /* =====================================================
           ANA SAYFA BUTONLARI
        ===================================================== */

        .home-buttons {

            position: absolute;

            z-index: 20;

            left: 50%;

            top: 72%;

            transform: translateX(-50%);

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 13px;

            width: min(430px, 82vw);
        }


        #start-button,
        #daily-challenge-button,
        #player-history-button {

            position: relative;

            width: 100%;

            height: 62px;

            padding: 0 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 13px;

            border-radius: 13px;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 1.5px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }


        #start-button {

            background:
                linear-gradient(
                    135deg,
                    #239c5a,
                    #31d979
                );

            color: #fff;

            border:
                1px solid
                rgba(113,255,164,0.7);

            box-shadow:

                0 12px 35px
                rgba(0,0,0,0.45),

                0 0 25px
                rgba(46,204,113,0.22),

                inset 0 1px 0
                rgba(255,255,255,0.25);
        }


        #start-button::before {
            content: "▶";
            font-size: 18px;
        }


        #daily-challenge-button {

            background:
                rgba(255,255,255,0.08);

            color: #ffffff;

            border:
                1px solid
                rgba(255,255,255,0.20);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.30);
        }


        #daily-challenge-button::before {

            content: "★";

            color: #35df82;

            font-size: 19px;
        }


        #player-history-button {

            height: 50px;

            background:
                rgba(25,82,56,0.72);

            color:
                rgba(235,255,243,0.92);

            border:
                1px solid
                rgba(74,205,128,0.28);

            font-size: 13px;

            letter-spacing: 1.2px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);
        }


        #player-history-button::before {

            content: "⚽";

            font-size: 17px;
        }


        #start-button:hover,
        #daily-challenge-button:hover,
        #player-history-button:hover {

            transform: translateY(-3px);

            filter: brightness(1.08);
        }


        #start-button:active,
        #daily-challenge-button:active,
        #player-history-button:active {

            transform: scale(0.98);
        }


        button:disabled {

            opacity: 0.55;

            cursor: not-allowed;
        }


        /* =====================================================
           GÜNLÜK DURUM
        ===================================================== */

        #daily-status {

            position: relative;

            z-index: 10;

            margin-top: 2px;

            min-height: 18px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1px;

            color:
                rgba(255,255,255,0.48);

            text-align: center;
        }


        #daily-status.completed {

            color: #35df82;
        }


        /* =====================================================
           ANA SAYFA İSTATİSTİKLERİ
        ===================================================== */

        #home-stats {

            position: absolute;

            z-index: 15;

            top: 8%;

            right: 4%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(105px, 1fr));

            gap: 8px;

            width: 245px;
        }


        .home-stat {

            padding:
                11px 12px;

            background:
                rgba(16,52,36,0.68);

            border:
                1px solid
                rgba(76,200,125,0.18);

            border-radius:
                10px;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            box-shadow:
                0 8px 22px
                rgba(0,0,0,0.20);
        }


        .home-stat-label {

            display: block;

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.2px;

            color:
                rgba(255,255,255,0.45);

            margin-bottom: 3px;
        }


        .home-stat-value {

            display: block;

            font-size: 17px;

            font-weight: 1000;

            color:
                #eafff1;
        }


        .home-stat-value.green {

            color:
                #45e88a;
        }


        /* =====================================================
           OYUN
        ===================================================== */

        #game-content {

            position: fixed;

            inset: 0;

            display: none;

            background:

                radial-gradient(
                    ellipse at center 42%,
                    rgba(45, 210, 115, 0.09),
                    transparent 38%
                ),

                linear-gradient(
                    180deg,
                    #020705 0%,
                    #06140e 55%,
                    #081b12 100%
                );

            z-index: 2;

            overflow: hidden;
        }


        .game-header {

            width: 100%;

            padding:
                28px 30px 0;

            text-align: center;

            position: relative;

            z-index: 10;
        }


        .game-header h1 {

            margin: 0;

            font-size: 22px;

            font-weight: 1000;

            letter-spacing: 2px;
        }


        .score {

            margin-top: 8px;

            color: #45e88a;

            font-size: 17px;

            font-weight: 900;
        }


        #question-number {

            margin-top: 5px;

            color:
                rgba(255,255,255,0.45);

            font-size: 11px;

            font-weight: 700;
        }


        /* =====================================================
           TIMER
        ===================================================== */

        .timer-container {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 5px;

            background:
                rgba(255,255,255,0.08);

            z-index: 50;
        }


        #timer-bar {

            width: 100%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #1fa85f,
                    #45e88a
                );

            transition:
                width 1s linear;
        }


        /* =====================================================
           OYUN ALANI
        ===================================================== */

        .game-area {

            position: absolute;

            left: 50%;

            top: 48%;

            transform:
                translate(-50%, -50%);

            width: min(900px, 90vw);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 35px;
        }


        .team {

            width: 310px;

            min-height: 220px;

            padding: 25px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 15px;

            background:

                linear-gradient(
                    145deg,
                    rgba(28,82,57,0.94),
                    rgba(17,61,42,0.94)
                );

            border:
                1px solid
                rgba(75,205,125,0.34);

            border-radius: 20px;

            box-shadow:

                0 15px 35px
                rgba(0,0,0,0.32),

                inset 0 1px 0
                rgba(255,255,255,0.07);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        .team:hover {

            transform:
                translateY(-2px);

            border-color:
                rgba(79,225,132,0.48);
        }


        .team-logo-wrapper {

            width: 105px;

            height: 105px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .team-logo {

            max-width: 100%;

            max-height: 100%;

            object-fit: contain;
        }


        .team-name {

            color: #ffffff;

            font-size: 19px;

            font-weight: 1000;

            text-align: center;

            text-shadow:
                0 3px 8px
                rgba(0,0,0,0.50);
        }


        /* =====================================================
           VS
        ===================================================== */

        .vs {

            width: 80px;

            height: 160px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            flex-shrink: 0;
        }


        #vs-text {

            position: relative;

            z-index: 5;

            display: none;

            font-size: 26px;

            font-weight: 1000;

            color: #fff;

            text-shadow:
                0 4px 10px
                rgba(0,0,0,0.7);

            background:
                rgba(25,78,53,0.94);

            border:
                1px solid
                rgba(76,204,126,0.30);

            border-radius: 50%;

            width: 65px;

            height: 65px;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.32);
        }


        /* =====================================================
           GERİ SAYIM
        ===================================================== */

        #countdown {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 180px;

            height: 150px;

            display: none;

            align-items: center;

            justify-content: center;

            background: transparent;

            border: none;

            font-size: 94px;

            font-weight: 1000;

            color: #ffffff;

            text-shadow:

                0 5px 15px
                rgba(0,0,0,0.8),

                0 0 25px
                rgba(255,255,255,0.18);

            z-index: 20;
        }


        #countdown.countdown-pop {

            animation:
                cleanCountdownPop
                0.8s
                cubic-bezier(
                    0.2,
                    0.8,
                    0.25,
                    1
                );
        }


        @keyframes cleanCountdownPop {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(0.55);

                opacity: 0;
            }

            45% {

                transform:
                    translate(-50%, -50%)
                    scale(1.15);

                opacity: 1;
            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

                opacity: 1;
            }
        }


        /* =====================================================
           CEVAP
        ===================================================== */

        .answer-area {

            position: absolute;

            left: 50%;

            bottom: 7%;

            transform:
                translateX(-50%);

            display: flex;

            flex-direction: row;

            align-items: flex-end;

            justify-content: center;

            gap: 10px;

            z-index: 30;
        }


        .answer-input-wrapper {

            width: 300px;

            display: flex;

            flex-direction: column;

            align-items: stretch;

            position: relative;
        }


        .answer-label {

            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 2px;

            color:
                rgba(255,255,255,0.55);

            text-align: center;
        }


        .answer-area input {

            width: 300px;

            height: 54px;

            padding: 0 17px;

            background:
                rgba(255,255,255,0.94);

            color: #10251b;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.22);

            font-size: 16px;
        }


        .answer-area input:focus {

            outline: none;

            border-color:
                rgba(46,204,113,0.75);
        }


        .answer-area input:disabled {

            opacity: 0.65;

            cursor: not-allowed;
        }


        #player-suggestions {

            width: 300px;

            position: absolute;

            left: 0;

            top: 62px;

            margin: 0;

            padding: 0;

            border: none;

            background: transparent;

            overflow: hidden;

            z-index: 100;
        }


        #player-suggestions:empty {

            display: none;
        }


        .player-suggestion {

            background:
                rgba(13,45,31,0.98);

            color: #fff;

            padding: 13px 15px;

            font-size: 16px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

            cursor: pointer;
        }


        .player-suggestion:hover {

            background:
                rgba(35,105,67,0.98);
        }


        #answerButton {

            width: 126px;

            height: 54px;

            background:

                linear-gradient(
                    135deg,
                    #ffffff,
                    #e8eee9
                );

            color: #0a2118;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 1000;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }


        #answerButton:hover:not(:disabled) {

            transform:
                translateY(-2px);

            filter:
                brightness(1.05);
        }


        /* =====================================================
           SONUÇ
        ===================================================== */

        #result {

            position: absolute;

            left: 50%;

            bottom: 2%;

            transform:
                translateX(-50%);

            min-height: 25px;

            font-size: 15px;

            font-weight: 1000;

            letter-spacing: 1px;

            z-index: 40;

            pointer-events: none;
        }


        #result.correct {

            color: #45e88a;
        }


        #result.wrong {

            color: #ff6b6b;
        }


        #result.timeout {

            color: #ffc857;
        }


        #result.result-visible {

            animation:
                resultPop
                0.25s
                ease-out;
        }


        @keyframes resultPop {

            0% {

                opacity: 0;

                transform:
                    translateX(-50%)
                    translateY(8px)
                    scale(0.95);
            }

            100% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           OYUN BİTİŞ
        ===================================================== */

        #game-over {

            display: none;

            position: fixed;

            inset: 0;

            align-items: center;

            justify-content: center;

            z-index: 500;

            padding: 20px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(29,100,61,0.20),
                    transparent 45%
                ),

                rgba(1,7,4,0.88);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);
        }


        .game-over-box {

            width: 470px;

            max-width: 88%;

            padding: 42px 40px 38px;

            text-align: center;

            background:

                linear-gradient(
                    145deg,
                    rgba(24,69,49,0.98),
                    rgba(10,34,24,0.98)
                );

            border:
                1px solid
                rgba(74,220,130,0.16);

            border-radius: 22px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.65);
        }


        .game-over-icon {

            font-size: 58px;

            margin-bottom: 8px;
        }


        .game-over h2 {

            margin: 0 0 25px;

            font-size: 34px;

            font-weight: 1000;
        }


        .final-score-label {

            margin-bottom: 2px;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 3px;

            color:
                rgba(255,255,255,0.48);
        }


        #final-score {

            margin: 0 0 12px;

            font-size: 64px;

            font-weight: 1000;

            color: #35df82;
        }


        #final-message {

            margin: 0 auto 30px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255,255,255,0.10);

            font-size: 17px;

            font-weight: 800;
        }


        #restart-button {

            width: 190px;

            height: 52px;

            background:

                linear-gradient(
                    135deg,
                    #ffffff,
                    #e7eee9
                );

            color: #0a2118;

            border-radius: 10px;

            font-weight: 1000;

            cursor: pointer;
        }


        /* =====================================================
           FUTBOLCU ARŞİVİ
        ===================================================== */

        #player-history-modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(0,0,0,0.72);

            backdrop-filter:
                blur(9px);

            -webkit-backdrop-filter:
                blur(9px);
        }


        #player-history-modal.active {

            display: flex;
        }


        .player-history-box {

            width: 600px;

            max-width: 95vw;

            max-height: 82vh;

            display: flex;

            flex-direction: column;

            background:

                linear-gradient(
                    145deg,
                    rgba(24,74,51,0.98),
                    rgba(8,30,20,0.99)
                );

            border:
                1px solid
                rgba(78,211,132,0.28);

            border-radius:
                20px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.70);

            overflow: hidden;
        }


        .player-history-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                22px 24px 18px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }


        .player-history-title {

            margin: 0;

            font-size: 22px;

            font-weight: 1000;
        }


        .player-history-subtitle {

            margin:
                5px 0 0;

            font-size: 11px;

            color:
                rgba(255,255,255,0.45);

            letter-spacing:
                0.8px;
        }


        #close-player-history {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.07);

            color:
                #ffffff;

            font-size: 20px;

            cursor: pointer;
        }


        #close-player-history:hover {

            background:
                rgba(255,255,255,0.13);
        }


        .player-history-summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            padding:
                14px 20px;
        }


        .history-summary-card {

            padding:
                10px;

            text-align: center;

            background:
                rgba(255,255,255,0.045);

            border-radius:
                10px;
        }


        .history-summary-label {

            display: block;

            font-size: 8px;

            color:
                rgba(255,255,255,0.40);

            letter-spacing:
                1px;
        }


        .history-summary-value {

            display: block;

            margin-top: 3px;

            font-size: 19px;

            font-weight: 1000;

            color:
                #45e88a;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        #player-history-list {

            overflow-y: auto;

            padding:
                4px 20px 20px;
        }


        .history-player {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                13px 15px;

            margin-bottom: 7px;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid
                rgba(255,255,255,0.045);

            border-radius:
                10px;
        }


        .history-player-left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .history-player-rank {

            width: 27px;

            height: 27px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:

    /* =====================================================

    const STATS_STORAGE_KEY =
        "321_game_statistics_v1";

        "321_daily_completed";


    function getDefaultStats() {

        return {

            highScore: 0,

            gamesPlayed: 0,

            currentCorrectStreak: 0,

            bestCorrectStreak: 0,

            dayStreak: 0,

            lastPlayedDate: null,

            playerCounts: {}

        };

    }


    function loadStats() {

        try {

            const saved =
                localStorage.getItem(
                    STATS_STORAGE_KEY
                );


            if (!saved) {

                return getDefaultStats();

            }


            const parsed =
                JSON.parse(saved);


            if (
                !parsed ||
                typeof parsed !== "object"
            ) {

                return getDefaultStats();

            }


            return {

                ...getDefaultStats(),

                ...parsed,

                playerCounts:
                    (
                        parsed.playerCounts &&
                        typeof parsed.playerCounts === "object"
                    )
                        ? parsed.playerCounts
                        : {}

            };

        }
        catch (error) {

            console.error(
                "İstatistikler okunamadı:",
                error
            );

            return getDefaultStats();

        }

    }


    let stats =
        loadStats();


    function saveStats() {

        try {

            localStorage.setItem(
                STATS_STORAGE_KEY,
                JSON.stringify(stats)
            );

        }
        catch (error) {

            console.error(
                "İstatistikler kaydedilemedi:",
                error
            );

        }

    }


    /* =====================================================
       TARİH
    ===================================================== */

    function getDateKey(date = new Date()) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                date.getDate()
            ).padStart(2, "0");

        return `${year}-${month}-${day}`;

    }


    function getTodayKey() {

        return getDateKey();

    }


    function getYesterdayKey() {

        const date =
            new Date();

        date.setDate(
            date.getDate() - 1
        );

        return getDateKey(date);

    }


    /* =====================================================
       GÜN SERİSİ
    ===================================================== */

    function updateDayStreak() {

        const today =
            getTodayKey();

        const yesterday =
            getYesterdayKey();


        if (
            stats.lastPlayedDate === today
        ) {

            return;

        }


        if (
            stats.lastPlayedDate === yesterday
        ) {

            stats.dayStreak =
                Math.max(
                    1,
                    Number(stats.dayStreak || 0) + 1
                );

        }
        else {

            stats.dayStreak = 1;

        }


        stats.lastPlayedDate =
            today;


        saveStats();

    }


    /* =====================================================
       ANA SAYFA İSTATİSTİKLERİ
    ===================================================== */

    function updateHomeStats() {

        if (homeHighScore) {

            homeHighScore.textContent =
                Number(stats.highScore || 0);

        }


        if (homeGamesPlayed) {

            homeGamesPlayed.textContent =
                Number(stats.gamesPlayed || 0);

        }


        if (homeCorrectStreak) {

            homeCorrectStreak.textContent =
                Number(
                    stats.currentCorrectStreak || 0
                );

        }


        if (homeDayStreak) {

            homeDayStreak.textContent =
                Number(stats.dayStreak || 0);

        }

    }


    /* =====================================================
       TEXT NORMALİZASYONU
    ===================================================== */

    function normalizeText(text) {

        let value =
            String(text ?? "")
                .trim()
                .toLocaleLowerCase("tr-TR");


        value =
            value
                .replace(/ı/g, "i")
                .replace(/ğ/g, "g")
                .replace(/ü/g, "u")
                .replace(/ş/g, "s")
                .replace(/ö/g, "o")
                .replace(/ç/g, "c");


        value =
            value.replace(
                /[.'’`-]/g,
                " "
            );


        value =
            value.replace(
                /\s+/g,
                " "
            );


        return value.trim();

    }


    function getPlayerNameWords(playerName) {

        return normalizeText(playerName)
            .split(" ")
            .filter(Boolean);

    }


    /* =====================================================
       OYUNCU TANIMA
    ===================================================== */

    function findRecognizedPlayer(userAnswer) {

        const normalizedAnswer =
            normalizeText(userAnswer);


        if (!normalizedAnswer) {

            return null;

        }


        const allPlayers =
            Object.keys(playerPool);


        const exactMatch =
            allPlayers.find(
                playerName =>
                    normalizeText(playerName) ===
                    normalizedAnswer
            );


        if (exactMatch) {

            return exactMatch;

        }


        const candidates =
            allPlayers.filter(
                playerName => {

                    const words =
                        getPlayerNameWords(
                            playerName
                        );


                    return words.includes(
                        normalizedAnswer
                    );

                }
            );


        if (
            candidates.length === 1
        ) {

            return candidates[0];

        }


        return null;

    }


    /* =====================================================
       OYUNCU ARŞİVİ
    ===================================================== */

    function recordPlayerWritten(userAnswer) {

        const recognizedPlayer =
            findRecognizedPlayer(
                userAnswer
            );


        if (!recognizedPlayer) {

            return;

        }


        if (
            typeof stats.playerCounts[
                recognizedPlayer
            ] !== "number"
        ) {

            stats.playerCounts[
                recognizedPlayer
            ] = 0;

        }


        stats.playerCounts[
            recognizedPlayer
        ]++;


        saveStats();

    }


    function updatePlayerHistory() {

        if (!playerHistoryList) {

            return;

        }


        const entries =
            Object.entries(
                stats.playerCounts || {}
            );


        const totalEntries =
            entries.reduce(
                (sum, [, count]) =>
                    sum + Number(count || 0),
                0
            );


        if (historyUniqueCount) {

            historyUniqueCount.textContent =
                entries.length;

        }


        if (historyTotalEntries) {

            historyTotalEntries.textContent =
                totalEntries;

        }


        entries.sort(
            (a, b) =>
                Number(b[1]) - Number(a[1]) ||
                a[0].localeCompare(
                    b[0],
                    "tr"
                )
        );


        if (historyMostWritten) {

            historyMostWritten.textContent =
                entries.length
                    ? entries[0][0]
                    : "-";

        }


        if (!entries.length) {

            playerHistoryList.innerHTML = `

                <div class="history-empty">

                    Henüz bir futbolcu yazmadın.<br>

                    Oyun oynadıkça futbolcu arşivin
                    burada oluşacak.

                </div>

            `;

    const teams =
        playableTeams.filter(
            team => {

                return Object.values(
                    playerPool
                ).some(
                    player => {

                        return (
                            player &&
                            Array.isArray(player.teams) &&
                            player.teams.includes(team)
                        );

                    }
                );

            }
        );


    /* =====================================================
       ORTAK FUTBOLCULAR
    ===================================================== */

    function findCommonPlayers(
        teamA,
        teamB
    ) {

        const commonPlayers = [];


        for (
            const playerName in playerPool
        ) {

            const playerData =
                playerPool[playerName];


            if (
                !playerData ||
                !Array.isArray(playerData.teams)
            ) {

                continue;

            }


            if (
                playerData.teams.includes(teamA) &&
                playerData.teams.includes(teamB)
            ) {

                commonPlayers.push(
                    playerName
                );

            }

        }


        return commonPlayers;

    }


    /* =====================================================
       GEÇERLİ EŞLEŞMELER
    ===================================================== */

    const validTeamPairs = [];


    for (
        let i = 0;
        i < teams.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < teams.length;
            j++
        ) {

            const teamA =
                teams[i];

            const teamB =
                teams[j];


            const commonPlayers =
                findCommonPlayers(
                    teamA,
                    teamB
                );


            if (
                commonPlayers.length > 0
            ) {

                validTeamPairs.push({

                    teamA,

                    teamB,

                    players:
                        commonPlayers

                });

            }

        }

    }


    /* =====================================================
       SORU KEY
    ===================================================== */

    function getQuestionKey(
        teamA,
        teamB
    ) {

        return [
            teamA,
            teamB
        ]
        .sort()
        .join("___");

    }


    /* =====================================================
       GÜNLÜK SEED
    ===================================================== */

    function getDailySeed() {

        const date =
            getTodayKey();

        let hash = 0;


        for (
            let i = 0;
            i < date.length;
            i++
        ) {

            hash =
                (
                    (
                        hash << 5
                    ) -
                    hash +
                    date.charCodeAt(i)
                ) |
                0;

        }


        return Math.abs(hash);

    }


    function seededRandom(seed) {

        const value =
            Math.sin(seed) * 10000;

        return value -
            Math.floor(value);

    }


    /* =====================================================
       GÜNLÜK SORULAR
    ===================================================== */

    function generateDailyQuestions() {

        if (
            validTeamPairs.length <
            totalQuestions
        ) {

            return [];

        }


        const pool =
            [...validTeamPairs];


        const seed =
            getDailySeed();


        for (
            let i = pool.length - 1;
            i > 0;
            i--
        ) {

            const random =
                seededRandom(
                    seed + i * 7919
                );


            const j =
                Math.floor(
                    random * (i + 1)
                );


            [
                pool[i],
                pool[j]
            ] =
            [
                pool[j],
                pool[i]
            ];

        }


        return pool.slice(
            0,
            totalQuestions
        );

    }

    /* =====================================================
       COUNTDOWN
    ===================================================== */

    function startCountdown(version) {

        return new Promise(
            resolve => {

                let count = 3;

                countdown.style.display =
                    "flex";


                vsText.style.display =
                    "none";


                team1.style.visibility =
                    "hidden";


                team2.style.visibility =
                    "hidden";


                const showNumber =
                    () => {

                        if (
                            version !== gameVersion
                        ) {

                            resolve(false);

                            return;

                        }


                        if (count > 0) {

                            countdown.textContent =
                                count;


                            countdown.classList.remove(
                                "countdown-pop"
                            );


                            void countdown.offsetWidth;


                            countdown.classList.add(
                                "countdown-pop"
                            );


                            count--;


                            const timeoutId =
                                setTimeout(
                                    showNumber,
                                    1000
                                );


                            countdownTimeouts.push(
                                timeoutId
                            );


                            return;

                        }


                        countdown.textContent =
                            "";


                        countdown.classList.remove(
                            "countdown-pop"
                        );


                        countdown.style.display =
                            "none";


                        team1.style.visibility =
                            "visible";


                        team2.style.visibility =
                            "visible";


                        vsText.textContent =
                            "VS";


                        vsText.style.display =
                            "flex";


                        const timeoutId =
                            setTimeout(
                                () => {

                                    if (
                                        version ===
                                        gameVersion
                                    ) {

                                        resolve(true);

                                    }

                                },
                                300
                            );


                        countdownTimeouts.push(
                            timeoutId
                        );

                    };


                showNumber();

            }
        );

    }


    /* =====================================================
       YENİ SORU
    ===================================================== */

    async function newQuestion() {

        if (gameCompleted) {

            return;

        }


        gameVersion++;

        const currentVersion =
            gameVersion;


        clearAllTimers();


        questionAnswered =
            false;


        answerInput.disabled =
            true;


        answerButton.disabled =
            true;


        answerInput.value =
            "";


        clearResult();

        clearPlayerSuggestions();


        if (
            questionNumber >=
            totalQuestions
        ) {

            endGame();

            return;

        }


        let selectedPair = null;


        /* =================================================
           GÜNLÜK
        ================================================= */

        if (
            currentGameMode === "daily"
        ) {

            selectedPair =
                dailyQuestions[
                    dailyQuestionIndex
                ];


            if (!selectedPair) {

                endGame();

                return;

            }


            dailyQuestionIndex++;

        }


        /* =================================================
           NORMAL
        ================================================= */

        else {

            let availableQuestions =
                validTeamPairs.filter(
                    pair => {

                        const key =
                            getQuestionKey(
                                pair.teamA,
                                pair.teamB
                            );


                        return !usedQuestions.includes(
                            key
                        );

                    }
                );


            if (
                availableQuestions.length === 0
            ) {

                usedQuestions = [];

                availableQuestions =
                    [...validTeamPairs];

            }


            if (
                availableQuestions.length === 0
            ) {

                alert(
                    "Yeterli ortak futbolcu içeren takım çifti bulunamadı."
                );

                return;

            }


            const randomIndex =
                Math.floor(
                    Math.random() *
                    availableQuestions.length
                );


            selectedPair =
                availableQuestions[
                    randomIndex
                ];


            usedQuestions.push(
                getQuestionKey(
                    selectedPair.teamA,
                    selectedPair.teamB
                )
            );

        }


        questionNumber++;


        questionNumberText.textContent =
            `Soru: ${questionNumber} / ${totalQuestions}`;


        currentQuestionPlayers =
            [...selectedPair.players];


        updateTeamDisplay(
            selectedPair.teamA,
            team1Logo,
            team1Name
        );


        updateTeamDisplay(
            selectedPair.teamB,
            team2Logo,
            team2Name
        );


        team1.style.visibility =
            "hidden";


        team2.style.visibility =
            "hidden";


        vsText.style.display =
            "none";


        countdown.textContent =
            "";


        countdown.style.display =
            "none";


        timerBar.style.width =
            "100%";


        const countdownFinished =
            await startCountdown(
                currentVersion
            );


        if (
            !countdownFinished ||
            currentVersion !== gameVersion ||
            gameCompleted
        ) {

            return;

        }


        answerInput.disabled =
            false;


        answerButton.disabled =
            false;


        answerInput.focus();


        startTimer(
            currentVersion
        );

    }


    /* =====================================================
       TIMER
    ===================================================== */

    function startTimer(version) {

        clearInterval(timer);


        timeLeft =
            questionTime;


        timerBar.style.width =
            "100%";


        timer =
            setInterval(
                () => {

                    if (
                        version !== gameVersion ||
                        gameCompleted
                    ) {

                        clearInterval(timer);

                        return;

                    }


                    timeLeft =
                        Math.max(
                            0,
                            timeLeft - 1
                        );


                    const percentage =
                        (
                            timeLeft /
                            questionTime
                        ) * 100;


                    timerBar.style.width =
                        `${percentage}%`;


                    if (
                        timeLeft <= 0
                    ) {

                        clearInterval(timer);

                        timer = null;


                        questionAnswered =
                            true;


                        answerInput.disabled =
                            true;


                        answerButton.disabled =
                            true;


                        clearPlayerSuggestions();


                        resetCorrectStreak();


                        showResult(
                            "timeout",
                            "SÜRE DOLDU"
                        );


                        const timeoutId =
                            setTimeout(
                                () => {

                                    if (
                                        version ===
                                        gameVersion &&
                                        !gameCompleted
                                    ) {

                                        newQuestion();

                                    }

                                },
                                1100
                            );


                        countdownTimeouts.push(
                            timeoutId
                        );

                    }

                },
                1000
            );

    }


    /* =====================================================
       CEVAP KARŞILAŞTIRMA
    ===================================================== */

    function normalizeAnswerForComparison(
        text
    ) {

        return normalizeText(text);

    }


    function isPlayerAnswerCorrect(
        userAnswer,
        playerName
    ) {

        const user =
            normalizeAnswerForComparison(
                userAnswer
            );


        const correct =
            normalizeAnswerForComparison(
                playerName
            );


        if (
            user === correct
        ) {

            return true;

        }


        const playerWords =
            getPlayerNameWords(
                playerName
            );


        return playerWords.some(
            word =>
                user === word
        );

    }


    /* =====================================================
       DOĞRU / YANLIŞ SERİ
    ===================================================== */

    function recordCorrectAnswer() {

        stats.currentCorrectStreak =
            Number(
                stats.currentCorrectStreak || 0
            ) + 1;


        if (
            stats.currentCorrectStreak >
            Number(
                stats.bestCorrectStreak || 0
            )
        ) {

            stats.bestCorrectStreak =
                stats.currentCorrectStreak;

        }


        saveStats();

        updateHomeStats();

    }


    function resetCorrectStreak() {

        stats.currentCorrectStreak =
            0;


        saveStats();

        updateHomeStats();

    }


    /* =====================================================
       CEVAP KONTROL
    ===================================================== */

    function checkAnswer() {

        if (
            questionAnswered ||
            answerInput.disabled ||
            gameCompleted
        ) {

            return;

        }


        const userAnswer =
            normalizeAnswerForComparison(
                answerInput.value
            );


        if (!userAnswer) {

            showResult(
                "wrong",
                "✕  BİR FUTBOLCU ADI YAZ"
            );

            return;

        }


        recordPlayerWritten(
            userAnswer
        );


        const correctPlayer =
            currentQuestionPlayers.find(
                playerName =>
                    isPlayerAnswerCorrect(
                        userAnswer,
                        playerName
                    )
            );


        /* =================================================
           DOĞRU
        ================================================= */

        if (correctPlayer) {

            score += 10;


            scoreText.textContent =
                `Puan: ${score}`;


            questionAnswered =
                true;


            clearAllTimers();


            answerInput.disabled =
                true;


            answerButton.disabled =
                true;


            clearPlayerSuggestions();


            recordCorrectAnswer();


            showResult(
                "correct",
                "✓  DOĞRU!"
            );


            const version =
                gameVersion;


            const timeoutId =
                setTimeout(
                    () => {

                        if (
                            version === gameVersion &&
                            !gameCompleted
                        ) {

                            newQuestion();

                        }

                    },
                    1000
                );


            countdownTimeouts.push(
                timeoutId
            );


            return;

        }


        /* =================================================
           YANLIŞ
        ================================================= */

        resetCorrectStreak();


        showResult(
            "wrong",
            "✕  YANLIŞ!"
        );

    }

    );

                0;


            gameModeTitle.textContent =
                "GÜNLÜK CHALLENGE";


            homeScreen.style.display =
                "none";


            gameContent.style.display =
                "block";


            resetGame();


            newQuestion();

        }
    );


    /* =====================================================
       TEKRAR OYNA
    ===================================================== */

    restartButton.addEventListener(
        "click",
        () => {

            if (
                currentGameMode === "daily" &&
                isDailyCompleted()
            ) {

                gameOver.style.display =
                    "none";


                gameContent.style.display =
                    "none";


                homeScreen.style.display =
                    "flex";


                updateDailyStatus();

                updateHomeStats();

                return;

            }


            resetGame();

            newQuestion();

        }
    );


    /* =====================================================
       BAŞLANGIÇ
    ===================================================== */

    homeScreen.style.display =
        "flex";


    gameContent.style.display =
        "none";


    gameOver.style.display =
        "none";


    updateDailyStatus();

    updateHomeStats();


    /* =====================================================
       DEBUG
    ===================================================== */

    console.log(
        "================================="
    );

    console.log(
        "3-2-1 ORTAK FUTBOLCU HAZIR"
    );

    console.log(
        "Oyuncu sayısı:",
        Object.keys(playerPool).length
    );

    console.log(
        "Aktif takım sayısı:",
        teams.length
    );

    console.log(
        "Geçerli soru sayısı:",
        validTeamPairs.length
    );

    console.log(
        "Günlük soru sayısı:",
        generateDailyQuestions().length
    );

    console.log(
        "Bugünün tarihi:",
        getTodayKey()
    );

    console.log(
        "İstatistikler:",
        stats
    );

    console.log(
        "================================="
    );

    </script>

</body>

</html>
