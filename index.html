<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3-2-1</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- ========================================
         ANA SAYFA
    ======================================== -->

    <div id="home-screen">

        <h1>3-2-1</h1>

        <p class="home-subtitle">
            İki takım arasındaki ortak futbolcuyu bul!
        </p>

        <button id="start-button">
            OYUNA BAŞLA
        </button>

    </div>


    <!-- ========================================
         OYUN ALANI
    ======================================== -->

    <div id="game-content">

        <h1>ORTAK FUTBOLCU</h1>


        <!-- SKOR -->

        <div
            class="score"
            id="score"
        >
            Puan: 0
        </div>


        <!-- SORU NUMARASI -->

        <div id="question-number">
            Soru: 0 / 10
        </div>


        <!-- ========================================
             SÜRE BARI
        ======================================== -->

        <div class="timer-container">

            <div id="timer-bar"></div>

        </div>


        <!-- ========================================
             TAKIMLAR VE GERİ SAYIM
        ======================================== -->

        <div class="game-area">


            <!-- 1. TAKIM -->

            <div
                class="team"
                id="team1"
            ></div>


            <!-- ORTA KISIM -->

            <div class="vs">

                <div id="countdown"></div>

                <div id="vs-text">
                    VS
                </div>

            </div>


            <!-- 2. TAKIM -->

            <div
                class="team"
                id="team2"
            ></div>

        </div>


        <!-- ========================================
             CEVAP ALANI
        ======================================== -->

        <div class="answer-area">

            <input
                type="text"
                id="answerInput"
                placeholder="Ortak futbolcuyu yaz"
                autocomplete="off"
            >


            <!-- OYUNCU ÖNERİLERİ -->

            <div id="player-suggestions"></div>


            <button id="answerButton">
                CEVAPLA
            </button>

        </div>


        <!-- CEVAP SONUCU -->

        <div id="result"></div>

    </div>


    <!-- ========================================
         OYUN BİTİŞ EKRANI
    ======================================== -->

    <div
        id="game-over"
        class="game-over"
    >

        <div class="game-over-box">

            <div class="trophy">
                🏆
            </div>

            <h2>
                OYUN BİTTİ!
            </h2>

            <div id="final-score">
                Final Skoru: 0
            </div>

            <div id="final-message">
                10 soruyu tamamladın!
            </div>

            <button id="restart-button">
                TEKRAR OYNA
            </button>

        </div>

    </div>


    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="players.js"></script>

    <script src="script.js"></script>


</body>

</html>
