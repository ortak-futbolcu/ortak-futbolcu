<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>3-2-1 | Ortak Futbolcuyu Bul</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           GLOBAL RESET / VIEWPORT
        ====================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #020705;

        }


        body {

            min-width: 100%;
            min-height: 100%;

        }


        *,
        *::before,
        *::after {

            box-sizing: border-box;

        }


        /* =====================================================
           ANA SAYFA
        ====================================================== */

        #home-screen {

            position: fixed !important;

            inset: 0 !important;

            width: 100vw !important;
            height: 100vh !important;

            min-width: 100vw !important;
            min-height: 100vh !important;

            max-width: none !important;
            max-height: none !important;

            margin: 0 !important;
            padding: 0 !important;

            transform: none !important;
            scale: 1 !important;
            zoom: 1 !important;

            display: flex !important;

            flex-direction: column;

            align-items: center;

            background:

                radial-gradient(
                    ellipse at 50% 34%,
                    rgba(35, 190, 100, 0.16) 0%,
                    rgba(20, 110, 60, 0.08) 22%,
                    transparent 48%
                ),

                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(25, 120, 65, 0.28) 0%,
                    transparent 58%
                ),

                linear-gradient(
                    180deg,
                    #010504 0%,
                    #03100a 45%,
                    #061910 72%,
                    #071d12 100%
                ) !important;

            overflow: hidden !important;

            z-index: 1;

        }


        /* =====================================================
           STADYUM ATMOSFERİ
        ====================================================== */

        #home-screen::before {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 0;

            background:

                radial-gradient(
                    ellipse at 8% 12%,
                    rgba(100,255,170,0.22),
                    transparent 14%
                ),

                radial-gradient(
                    ellipse at 92% 12%,
                    rgba(100,255,170,0.22),
                    transparent 14%
                ),

                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.58) 0%,
                    transparent 23%,
                    transparent 77%,
                    rgba(0,0,0,0.58) 100%
                );

        }


        #home-screen::after {

            content: "";

            position: absolute;

            left: 50%;
            bottom: -13%;

            width: 88%;
            height: 48%;

            transform: translateX(-50%);

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;

            border:
                1px solid
                rgba(90,220,140,0.13);

            box-shadow:

                0 0 80px
                rgba(40,190,100,0.10),

                inset 0 0 70px
                rgba(40,190,100,0.08);

        }


        /* =====================================================
           321 LOGO
        ====================================================== */

        #home-screen h1 {

            position: absolute !important;

            z-index: 5;

            top: 9vh !important;
            left: 50% !important;

            transform:
                translateX(-50%)
                none !important;

            width: auto !important;
            max-width: none !important;

            margin: 0 !important;
            padding: 0 !important;

            display: block !important;

            font-size:
                clamp(
                    120px,
                    16vw,
                    250px
                ) !important;

            line-height: 0.78 !important;

            font-weight: 1000 !important;

            font-style: italic;

            letter-spacing: -0.065em;

            white-space: nowrap;

            text-align: center;

            background:

                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #e8ecea 28%,
                    #42e889 44%,
                    #17c967 56%,
                    #eef2ef 72%,
                    #ffffff 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            filter:
                drop-shadow(
                    0 15px 15px
                    rgba(0,0,0,0.65)
                )

                drop-shadow(
                    0 0 18px
                    rgba(48,220,120,0.18)
                );

        }


        /* =====================================================
           ALT BAŞLIK
        ====================================================== */

        #home-screen .home-subtitle {

            position: absolute !important;

            z-index: 5;

            top: 39vh !important;
            left: 50% !important;

            transform:
                translateX(-50%)
                none !important;

            width: max-content !important;

            margin: 0 !important;
            padding: 0 !important;

            display: flex !important;

            align-items: center;
            justify-content: center;

            gap: 22px;

            font-size:
                clamp(
                    11px,
                    1vw,
                    16px
                ) !important;

            line-height: 1;

            font-weight: 900 !important;

            letter-spacing:
                clamp(
                    2px,
                    0.32vw,
                    5px
                );

            color:
                rgba(255,255,255,0.92) !important;

            white-space: nowrap;

        }


        #home-screen .home-subtitle::before,
        #home-screen .home-subtitle::after {

            content: "";

            display: block;

            width:
                clamp(
                    28px,
                    3.5vw,
                    65px
                );

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #35df82
                );

            box-shadow:
                0 0 7px
                rgba(53,223,130,0.35);

        }


        #home-screen .home-subtitle::after {

            background:
                linear-gradient(
                    90deg,
                    #35df82,
                    transparent
                );

        }


        /* =====================================================
           BUTON KONTEYNERİ
        ====================================================== */

        .home-buttons {

            position: absolute !important;

            z-index: 20;

            top: 61vh !important;
            left: 50% !important;

            transform:
                translateX(-50%)
                none !important;

            width:
                clamp(
                    360px,
                    39vw,
                    600px
                ) !important;

            max-width: 600px !important;
            min-width: 280px !important;

            height: auto !important;

            margin: 0 !important;
            padding: 0 !important;

            display: flex !important;

            flex-direction: column !important;

            align-items: center !important;

            justify-content: flex-start !important;

            gap: 18px !important;

        }


        /* =====================================================
           BUTONLAR
        ====================================================== */

        #start-button,
        #daily-challenge-button {

            position: relative !important;

            width: 100% !important;

            max-width: none !important;
            min-width: 0 !important;

            margin: 0 !important;

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            box-sizing: border-box !important;

            cursor: pointer;

            font-family: inherit;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;

        }


        /* =====================================================
           OYUNA BAŞLA
        ====================================================== */

        #start-button {

            height:
                clamp(
                    72px,
                    7vh,
                    100px
                ) !important;

            padding:
                0 40px !important;

            border-radius:
                clamp(
                    12px,
                    1vw,
                    18px
                ) !important;

            gap: 18px !important;

            font-size:
                clamp(
                    19px,
                    1.45vw,
                    27px
                ) !important;

            font-weight: 1000 !important;

            letter-spacing:
                clamp(
                    1px,
                    0.18vw,
                    3px
                ) !important;

            color: #ffffff !important;

            background:

                linear-gradient(
                    135deg,
                    #159d56 0%,
                    #25c96c 45%,
                    #37e881 100%
                ) !important;

            border:
                1px solid
                rgba(113,255,164,0.85) !important;

            box-shadow:

                0 14px 35px
                rgba(0,0,0,0.45),

                0 0 30px
                rgba(46,204,113,0.25),

                inset 0 1px 0
                rgba(255,255,255,0.32);

        }


        #start-button::before {

            content: "▶";

            display: inline-block;

            color: #ffffff;

            font-size:
                clamp(
                    20px,
                    1.5vw,
                    28px
                );

            line-height: 1;

        }


        /* =====================================================
           GÜNLÜK CHALLENGE
        ====================================================== */

        #daily-challenge-button {

            width:
                82% !important;

            height:
                clamp(
                    58px,
                    5.8vh,
                    78px
                ) !important;

            padding:
                0 30px !important;

            border-radius:
                clamp(
                    10px,
                    0.9vw,
                    15px
                ) !important;

            gap: 15px !important;

            font-size:
                clamp(
                    15px,
                    1.05vw,
                    20px
                ) !important;

            font-weight: 900 !important;

            letter-spacing:
                clamp(
                    1px,
                    0.12vw,
                    2px
                ) !important;

            color: #ffffff !important;

            background:
                linear-gradient(
                    135deg,
                    rgba(18,51,37,0.96),
                    rgba(10,32,23,0.96)
                ) !important;

            border:
                1px solid
                rgba(53,223,130,0.55) !important;

            box-shadow:

                0 10px 30px
                rgba(0,0,0,0.32),

                inset 0 1px 0
                rgba(255,255,255,0.08);

        }


        #daily-challenge-button::before {

            content: "★";

            display: inline-block;

            color: #35df82;

            font-size:
                clamp(
                    18px,
                    1.3vw,
                    25px
                );

        }


        /* =====================================================
           BUTON HOVER
        ====================================================== */

        #start-button:hover,
        #daily-challenge-button:hover {

            transform:
                translateY(-3px) !important;

            filter:
                brightness(1.08);

        }


        #start-button:active,
        #daily-challenge-button:active {

            transform:
                translateY(1px)
                scale(0.99) !important;

        }


        #start-button:disabled,
        #daily-challenge-button:disabled {

            cursor: default;

            opacity: 0.6;

        }


        /* =====================================================
           DAILY STATUS
        ====================================================== */

        #daily-status {

            position: relative !important;

            z-index: 25;

            width: 100%;

            min-height: 20px;

            margin:
                -3px 0 0 !important;

            padding: 0;

            text-align: center;

            font-size:
                clamp(
                    9px,
                    0.65vw,
                    13px
                ) !important;

            line-height: 1.2;

            font-weight: 800 !important;

            letter-spacing:
                clamp(
                    0.5px,
                    0.08vw,
                    1.5px
                );

            color:
                rgba(255,255,255,0.45);

        }


        #daily-status.completed {

            color: #35df82 !important;

        }


        /* =====================================================
           OYUN EKRANI
        ====================================================== */

        #game-content {

            position: fixed !important;

            inset: 0 !important;

            width: 100vw !important;
            height: 100vh !important;

            min-width: 100vw !important;
            min-height: 100vh !important;

            max-width: none !important;
            max-height: none !important;

            margin: 0 !important;
            padding: 0 !important;

            transform: none !important;
            scale: 1 !important;
            zoom: 1 !important;

            overflow: hidden !important;

        }


        /* =====================================================
           GERİ SAYIM
        ====================================================== */

        #countdown {

            width: 180px !important;
            height: 150px !important;

            background: transparent !important;

            border: none !important;

            border-radius: 0 !important;

            box-shadow: none !important;

            font-size: 94px !important;

            font-weight: 1000 !important;

            color: #ffffff !important;

            text-shadow:

                0 5px 15px
                rgba(0,0,0,0.8),

                0 0 25px
                rgba(255,255,255,0.18);

        }


        #countdown.countdown-pop {

            animation:
                cleanCountdownPop
                0.8s
                cubic-bezier(
                    0.2,
                    0.8,
                    0.25,
                    1
                );

        }


        @keyframes cleanCountdownPop {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(0.55);

                opacity: 0;

            }

            45% {

                transform:
                    translate(-50%, -50%)
                    scale(1.15);

                opacity: 1;

            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

                opacity: 1;

            }

        }


        #vs-text {

            position: relative;

            z-index: 5;

            font-size: 30px;

            font-weight: 1000;

            color: #ffffff;

            text-shadow:
                0 4px 10px rgba(0,0,0,0.7);

        }


        /* =====================================================
           CEVAP ALANI
        ====================================================== */

        .answer-area {

            flex-direction: column;

            align-items: center;

            gap: 12px;

        }


        .answer-input-wrapper {

            width: 300px;

            display: flex;

            flex-direction: column;

            align-items: center;

            position: relative;

        }


        .answer-label {

            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 2px;

            color:
                rgba(255,255,255,0.55);

        }


        .answer-area input {

            width: 300px !important;

            height: 54px;

            padding: 0 17px;

            background:
                rgba(255,255,255,0.94) !important;

            color: #10251b;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.22);

        }


        .answer-area input:focus {

            outline: none;

            border-color:
                rgba(46,204,113,0.75);

        }


        #player-suggestions {

            width: 300px !important;

            position: absolute;

            left: 0;

            top: 62px;

            margin: 0 !important;

            padding: 0;

            border: none !important;

            background: transparent !important;

            box-shadow: none;

            overflow: hidden;

            z-index: 50;

        }


        #player-suggestions:empty {

            display: none !important;

        }


        .player-suggestion {

            background:
                rgba(13,45,31,0.98) !important;

            color: #ffffff;

            padding: 13px 15px;

            font-size: 16px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

            cursor: pointer;

        }


        .player-suggestion:hover {

            background:
                rgba(35,105,67,0.98) !important;

        }


        .answer-area > #answerButton {

            width: 126px;

            height: 54px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #e8eee9
                );

            color: #0a2118;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 1000;

            cursor: pointer;

        }


        @media (min-width: 701px) {

            .answer-area {

                flex-direction: row;

                align-items: flex-end;

                justify-content: center;

                gap: 10px;

            }

            .answer-input-wrapper {

                align-items: stretch;

            }

            .answer-label {

                text-align: center;

            }

        }


        #result {

            border: none !important;

        }


        /* =====================================================
           OYUN BİTİŞ
        ====================================================== */

        .game-over {

            background:

                radial-gradient(
                    circle at center,
                    rgba(29,100,61,0.20),
                    transparent 45%
                ),

                rgba(1,7,4,0.88);

            backdrop-filter: blur(8px);

        }


        .game-over-box {

            width: 470px;

            max-width: 88%;

            padding: 42px 40px 38px;

            background:

                linear-gradient(
                    145deg,
                    rgba(24,69,49,0.98),
                    rgba(10,34,24,0.98)
                );

            border:
                1px solid
                rgba(74,220,130,0.16);

            border-radius: 22px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.65);

        }


        .game-over-icon {

            font-size: 58px;

            margin-bottom: 8px;

        }


        .game-over h2 {

            margin: 0 0 25px;

            font-size: 34px;

            font-weight: 1000;

        }


        .final-score-label {

            margin-bottom: 2px;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 3px;

            color:
                rgba(255,255,255,0.48);

        }


        #final-score {

            margin: 0 0 12px;

            font-size: 64px;

            font-weight: 1000;

            color: #35df82;

        }


        #final-message {

            margin: 0 auto 30px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255,255,255,0.10);

            font-size: 17px;

            font-weight: 800;

        }


        #restart-button {

            width: 190px;

            height: 52px;

            background:

                linear-gradient(
                    135deg,
                    #ffffff,
                    #e7eee9
                );

            color: #0a2118;

            border-radius: 10px;

            font-weight: 1000;

            cursor: pointer;

        }


        /* =====================================================
           MOBİL
        ====================================================== */

        @media (max-width: 700px) {

            #home-screen h1 {

                top: 12vh !important;

                font-size: 27vw !important;

                letter-spacing: -0.06em;

            }


            #home-screen .home-subtitle {

                top: 32vh !important;

                font-size: 10px !important;

                letter-spacing: 2.5px;

                gap: 10px;

            }


            .home-buttons {

                top: 58vh !important;

                width: 82vw !important;

                min-width: 0 !important;

            }


            #start-button {

                height: 62px !important;

                font-size: 17px !important;

            }


            #daily-challenge-button {

                width: 86% !important;

                height: 54px !important;

                font-size: 13px !important;

            }


            #countdown {

                width: 110px !important;

                height: 110px !important;

                font-size: 62px !important;

            }


            .answer-area {

                margin-top: 48px;

            }


            .answer-input-wrapper {

                width: 70%;

            }


            .answer-area input {

                width: 100% !important;

            }


            #player-suggestions {

                width: 100% !important;

            }


            .answer-area > #answerButton {

                width: 150px;

                height: 50px;

            }


            .game-over-box {

                padding: 35px 25px 32px;

            }


            .game-over h2 {

                font-size: 28px;

            }


            #final-score {

                font-size: 52px;

            }

        }


        /* =====================================================
           KISA EKRAN
        ====================================================== */

        @media (
            max-height: 700px
        ) and (
            min-width: 701px
        ) {

            #home-screen h1 {

                top: 5vh !important;

                font-size: 20vh !important;

            }


            #home-screen .home-subtitle {

                top: 29vh !important;

            }


            .home-buttons {

                top: 57vh !important;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ANA SAYFA
    ====================================================== -->

    <div id="home-screen">

        <h1>321</h1>


        <p class="home-subtitle">
            ORTAK FUTBOLCUYU BUL
        </p>


        <div class="home-buttons">

            <button
                type="button"
                id="start-button"
                aria-label="Oyuna Başla"
            >
                OYUNA BAŞLA
            </button>


            <button
                type="button"
                id="daily-challenge-button"
                aria-label="Günlük Challenge"
            >
                GÜNLÜK CHALLENGE
            </button>


            <div id="daily-status"></div>

        </div>

    </div>



    <!-- =====================================================
         OYUN EKRANI
    ====================================================== -->

    <div id="game-content">

        <header class="game-header">

            <h1>

                <span id="game-mode-title">
                    ORTAK FUTBOLCU
                </span>

            </h1>


            <div
                class="score"
                id="score"
            >
                Puan: 0
            </div>


            <div id="question-number">
                Soru: 0 / 10
            </div>

        </header>


        <div class="timer-container">

            <div id="timer-bar"></div>

        </div>


        <div class="game-area">

            <div
                class="team"
                id="team1"
            >

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        id="team1-logo"
                        src=""
                        alt=""
                    >

                </div>


                <span
                    class="team-name"
                    id="team1-name"
                ></span>

            </div>


            <div class="vs">

                <div id="countdown"></div>

                <div id="vs-text">
                    VS
                </div>

            </div>


            <div
                class="team"
                id="team2"
            >

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        id="team2-logo"
                        src=""
                        alt=""
                    >

                </div>


                <span
                    class="team-name"
                    id="team2-name"
                ></span>

            </div>

        </div>


        <div class="answer-area">

            <div class="answer-input-wrapper">

                <label
                    class="answer-label"
                    for="answerInput"
                >
                    FUTBOLCU ADINI GİR
                </label>


                <input
                    type="text"
                    id="answerInput"
                    placeholder="Ortak futbolcuyu yaz"
                    autocomplete="off"
                    spellcheck="false"
                >


                <div id="player-suggestions"></div>

            </div>


            <button
                type="button"
                id="answerButton"
            >
                CEVAPLA
            </button>

        </div>


        <div
            id="result"
            aria-live="polite"
        ></div>

    </div>



    <!-- =====================================================
         OYUN BİTİŞ
    ====================================================== -->

    <div
        id="game-over"
        class="game-over"
    >

        <div class="game-over-box">

            <div class="game-over-icon">
                🏆
            </div>


            <h2 id="game-over-title">
                OYUN TAMAMLANDI
            </h2>


            <div class="final-score-label">
                PUAN
            </div>


            <div id="final-score">
                0
            </div>


            <div id="final-message">
                10 soruyu tamamladın!
            </div>


            <button
                type="button"
                id="restart-button"
            >
                TEKRAR OYNA
            </button>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="players.js"></script>

    <script src="script.js"></script>


</body>

</html>
