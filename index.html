<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3-2-1</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           ANA SAYFA
        ====================================================== */

        #home-screen {

            position: relative;

            background-image: none !important;

            background:

                radial-gradient(
                    ellipse at center 42%,
                    rgba(45, 210, 115, 0.12),
                    transparent 35%
                ),

                radial-gradient(
                    ellipse at center bottom,
                    rgba(20, 100, 60, 0.20),
                    transparent 55%
                ),

                linear-gradient(
                    180deg,
                    #020705 0%,
                    #06140e 50%,
                    #081b12 100%
                ) !important;

            overflow: hidden;

        }


        #home-screen::before {

            content: "";

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    ellipse at 50% 18%,
                    rgba(255,255,255,0.055),
                    transparent 28%
                ),

                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.48),
                    transparent 24%,
                    transparent 76%,
                    rgba(0,0,0,0.48)
                );

            pointer-events: none;

        }


        #home-screen::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: -18%;

            transform: translateX(-50%);

            width: 85%;

            height: 48%;

            border-radius: 50%;

            background:

                radial-gradient(
                    ellipse,
                    rgba(49,220,120,0.16),
                    transparent 67%
                );

            filter: blur(14px);

            pointer-events: none;

        }


        /* =====================================================
           321
        ====================================================== */

        #home-screen h1 {

            display: block !important;

            position: relative;

            z-index: 5;

            margin: 0;

            font-size:
                clamp(100px, 15vw, 225px);

            line-height: 0.82;

            font-weight: 1000;

            font-style: italic;

            letter-spacing: -9px;

            background:

                linear-gradient(
                    100deg,
                    #ffffff 0%,
                    #f4f7f5 22%,
                    #5af39a 42%,
                    #27d879 52%,
                    #8af5b5 61%,
                    #ffffff 78%,
                    #f1f5f2 100%
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

            filter:
                drop-shadow(
                    0 8px 10px
                    rgba(0,0,0,0.55)
                )
                drop-shadow(
                    0 0 18px
                    rgba(49,220,120,0.18)
                );

        }


        #home-screen .home-subtitle {

            display: block !important;

            position: relative;

            z-index: 5;

            margin: 25px 0 0;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 4px;

            text-transform: uppercase;

            color:
                rgba(235,255,243,0.72) !important;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,0.65);

        }


        /* =====================================================
           ANA SAYFA BUTONLARI
        ====================================================== */

        .home-buttons {

            position: absolute;

            z-index: 20;

            left: 50%;

            top: 72%;

            transform: translateX(-50%);

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 13px;

            width: min(430px, 82vw);

        }


        #start-button,
        #daily-challenge-button,
        #player-history-button {

            position: relative;

            width: 100%;

            height: 62px;

            padding: 0 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 13px;

            border-radius: 13px;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 1.5px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;

        }


        #start-button {

            background:

                linear-gradient(
                    135deg,
                    #239c5a,
                    #31d979
                ) !important;

            color: #fff !important;

            border:
                1px solid
                rgba(113,255,164,0.7) !important;

            box-shadow:

                0 12px 35px
                rgba(0,0,0,0.45),

                0 0 25px
                rgba(46,204,113,0.22),

                inset 0 1px 0
                rgba(255,255,255,0.25);

        }


        #start-button::before {

            content: "▶";

            font-size: 18px;

        }


        #daily-challenge-button {

            background:
                rgba(255,255,255,0.08) !important;

            color: #ffffff !important;

            border:
                1px solid
                rgba(255,255,255,0.20) !important;

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.30);

        }


        #daily-challenge-button::before {

            content: "★";

            color: #35df82;

            font-size: 19px;

        }


        /* =====================================================
           FUTBOLCU ARŞİVİ BUTONU
        ====================================================== */

        #player-history-button {

            height: 50px;

            background:
                rgba(25,82,56,0.72) !important;

            color:
                rgba(235,255,243,0.92) !important;

            border:
                1px solid
                rgba(74,205,128,0.28) !important;

            font-size: 13px;

            letter-spacing: 1.2px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);

        }


        #player-history-button::before {

            content: "⚽";

            font-size: 17px;

        }


        #start-button:hover,
        #daily-challenge-button:hover,
        #player-history-button:hover {

            transform:
                translateY(-3px);

            filter:
                brightness(1.08);

        }


        #start-button:active,
        #daily-challenge-button:active,
        #player-history-button:active {

            transform:
                scale(0.98);

        }


        /* =====================================================
           GÜNLÜK DURUM
        ====================================================== */

        #daily-status {

            position: relative;

            z-index: 10;

            margin-top: 2px;

            min-height: 18px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1px;

            color:
                rgba(255,255,255,0.48);

            text-align: center;

        }


        #daily-status.completed {

            color:
                #35df82;

        }


        /* =====================================================
           İSTATİSTİK ÖZETİ
        ====================================================== */

        #home-stats {

            position: absolute;

            z-index: 15;

            top: 8%;

            right: 4%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(105px, 1fr));

            gap: 8px;

            width: 245px;

        }


        .home-stat {

            padding:
                11px 12px;

            background:
                rgba(16,52,36,0.68);

            border:
                1px solid
                rgba(76,200,125,0.18);

            border-radius:
                10px;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            box-shadow:
                0 8px 22px
                rgba(0,0,0,0.20);

        }


        .home-stat-label {

            display: block;

            font-size: 8px;

            font-weight: 800;

            letter-spacing: 1.2px;

            color:
                rgba(255,255,255,0.45);

            margin-bottom: 3px;

        }


        .home-stat-value {

            display: block;

            font-size: 17px;

            font-weight: 1000;

            color:
                #eafff1;

        }


        .home-stat-value.green {

            color:
                #45e88a;

        }


        /* =====================================================
           OYUN EKRANI
        ====================================================== */

        #game-content {

            position: relative;

        }


        /* =====================================================
           GERİ SAYIM
        ====================================================== */

        #countdown {

            width: 180px !important;

            height: 150px !important;

            background: transparent !important;

            border: none !important;

            border-radius: 0 !important;

            box-shadow: none !important;

            font-size: 94px !important;

            font-weight: 1000 !important;

            color: #ffffff !important;

            text-shadow:

                0 5px 15px
                rgba(0,0,0,0.8),

                0 0 25px
                rgba(255,255,255,0.18);

        }


        #countdown.countdown-pop {

            animation:
                cleanCountdownPop
                0.8s
                cubic-bezier(
                    0.2,
                    0.8,
                    0.25,
                    1
                );

        }


        @keyframes cleanCountdownPop {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(0.55);

                opacity: 0;

            }

            45% {

                transform:
                    translate(-50%, -50%)
                    scale(1.15);

                opacity: 1;

            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

                opacity: 1;

            }

        }


        #vs-text {

            position: relative;

            z-index: 5;

            font-size: 30px;

            font-weight: 1000;

            color: #fff;

            text-shadow:
                0 4px 10px
                rgba(0,0,0,0.7);

            background:
                rgba(25,78,53,0.94) !important;

            border:
                1px solid
                rgba(76,204,126,0.30);

            border-radius:
                50%;

            padding:
                10px 12px;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.32),

                inset 0 1px 0
                rgba(255,255,255,0.06);

        }


        /* =====================================================
           TAKIM KUTULARI
        ====================================================== */

        .team {

            background:

                linear-gradient(
                    145deg,
                    rgba(28,82,57,0.94),
                    rgba(17,61,42,0.94)
                ) !important;

            border:
                1px solid
                rgba(75,205,125,0.34) !important;

            box-shadow:

                0 15px 35px
                rgba(0,0,0,0.32),

                inset 0 1px 0
                rgba(255,255,255,0.07) !important;

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .team:hover {

            background:

                linear-gradient(
                    145deg,
                    rgba(34,96,65,0.97),
                    rgba(20,70,48,0.97)
                ) !important;

            border-color:
                rgba(79,225,132,0.48) !important;

            transform:
                translateY(-2px);

        }


        .team-name {

            color:
                #ffffff !important;

            text-shadow:
                0 3px 8px
                rgba(0,0,0,0.50);

        }


        /* =====================================================
           CEVAP ALANI
        ====================================================== */

        .answer-area {

            flex-direction: column;

            align-items: center;

            gap: 12px;

        }


        .answer-input-wrapper {

            width: 300px;

            display: flex;

            flex-direction: column;

            align-items: center;

            position: relative;

        }


        .answer-label {

            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 2px;

            color:
                rgba(255,255,255,0.55);

        }


        .answer-area input {

            width: 300px !important;

            height: 54px;

            padding: 0 17px;

            background:
                rgba(255,255,255,0.94) !important;

            color: #10251b;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.22);

        }


        .answer-area input:focus {

            outline: none;

            border-color:
                rgba(46,204,113,0.75);

        }


        #player-suggestions {

            width: 300px !important;

            position: absolute;

            left: 0;

            top: 62px;

            margin: 0 !important;

            padding: 0;

            border: none !important;

            background: transparent !important;

            box-shadow: none;

            overflow: hidden;

            z-index: 100;

        }


        #player-suggestions:empty {

            display: none !important;

        }


        .player-suggestion {

            background:
                rgba(13,45,31,0.98) !important;

            color: #fff;

            padding: 13px 15px;

            font-size: 16px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

            cursor: pointer;

        }


        .player-suggestion:hover {

            background:
                rgba(35,105,67,0.98) !important;

        }


        .answer-area > #answerButton {

            width: 126px;

            height: 54px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #e8eee9
                );

            color: #0a2118;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 1000;

        }


        @media (min-width: 701px) {

            .answer-area {

                flex-direction: row;

                align-items: flex-end;

                justify-content: center;

                gap: 10px;

            }

            .answer-input-wrapper {

                align-items: stretch;

            }

            .answer-label {

                text-align: center;

            }

        }


        #result {

            border: none !important;

        }


        /* =====================================================
           OYUN BİTİŞ
        ====================================================== */

        .game-over {

            background:

                radial-gradient(
                    circle at center,
                    rgba(29,100,61,0.20),
                    transparent 45%
                ),

                rgba(1,7,4,0.88);

            backdrop-filter:
                blur(8px);

        }


        .game-over-box {

            width: 470px;

            max-width: 88%;

            padding: 42px 40px 38px;

            background:

                linear-gradient(
                    145deg,
                    rgba(24,69,49,0.98),
                    rgba(10,34,24,0.98)
                );

            border:
                1px solid
                rgba(74,220,130,0.16);

            border-radius: 22px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.65);

        }


        .game-over-icon {

            font-size: 58px;

            margin-bottom: 8px;

        }


        .game-over h2 {

            margin: 0 0 25px;

            font-size: 34px;

            font-weight: 1000;

        }


        .final-score-label {

            margin-bottom: 2px;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 3px;

            color:
                rgba(255,255,255,0.48);

        }


        #final-score {

            margin: 0 0 12px;

            font-size: 64px;

            font-weight: 1000;

            color: #35df82;

        }


        #final-message {

            margin: 0 auto 30px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255,255,255,0.10);

            font-size: 17px;

            font-weight: 800;

        }


        #restart-button {

            width: 190px;

            height: 52px;

            background:

                linear-gradient(
                    135deg,
                    #ffffff,
                    #e7eee9
                );

            color: #0a2118;

            border-radius: 10px;

            font-weight: 1000;

        }


        /* =====================================================
           FUTBOLCU ARŞİVİ MODALI
        ====================================================== */

        #player-history-modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                rgba(0,0,0,0.72);

            backdrop-filter:
                blur(9px);

            -webkit-backdrop-filter:
                blur(9px);

        }


        #player-history-modal.active {

            display: flex;

        }


        .player-history-box {

            width: 600px;

            max-width: 95vw;

            max-height: 82vh;

            display: flex;

            flex-direction: column;

            background:

                linear-gradient(
                    145deg,
                    rgba(24,74,51,0.98),
                    rgba(8,30,20,0.99)
                );

            border:
                1px solid
                rgba(78,211,132,0.28);

            border-radius:
                20px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.70);

            overflow: hidden;

        }


        .player-history-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                22px 24px 18px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

        }


        .player-history-title {

            margin: 0;

            font-size: 22px;

            font-weight: 1000;

            color:
                #ffffff;

        }


        .player-history-subtitle {

            margin:
                5px 0 0;

            font-size: 11px;

            color:
                rgba(255,255,255,0.45);

            letter-spacing:
                0.8px;

        }


        #close-player-history {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.07);

            color:
                #ffffff;

            font-size: 20px;

            cursor: pointer;

        }


        #close-player-history:hover {

            background:
                rgba(255,255,255,0.13);

        }


        .player-history-summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            padding:
                14px 20px;

        }


        .history-summary-card {

            padding:
                10px;

            text-align: center;

            background:
                rgba(255,255,255,0.045);

            border-radius:
                10px;

        }


        .history-summary-label {

            display: block;

            font-size: 8px;

            color:
                rgba(255,255,255,0.40);

            letter-spacing:
                1px;

        }


        .history-summary-value {

            display: block;

            margin-top: 3px;

            font-size: 19px;

            font-weight: 1000;

            color:
                #45e88a;

        }


        #player-history-list {

            overflow-y: auto;

            padding:
                4px 20px 20px;

        }


        .history-player {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                13px 15px;

            margin-bottom: 7px;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid
                rgba(255,255,255,0.045);

            border-radius:
                10px;

        }


        .history-player-left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .history-player-rank {

            width: 27px;

            height: 27px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(53,223,130,0.12);

            color:
                #45e88a;

            font-size: 11px;

            font-weight: 1000;

            flex-shrink: 0;

        }


        .history-player-name {

            color:
                #ffffff;

            font-size: 14px;

            font-weight: 800;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .history-player-count {

            color:
                #45e88a;

            font-size: 13px;

            font-weight: 1000;

            white-space: nowrap;

        }


        .history-empty {

            padding:
                50px 20px;

            text-align: center;

            color:
                rgba(255,255,255,0.42);

            font-size: 13px;

            line-height: 1.7;

        }


        /* =====================================================
           MOBİL
        ====================================================== */

        @media (max-width: 700px) {

            #home-screen h1 {

                font-size: 26vw;

                letter-spacing: -3px;

            }


            #home-screen .home-subtitle {

                font-size: 10px;

                letter-spacing: 2.5px;

            }


            .home-buttons {

                top: 67%;

                width: 76vw;

            }


            #start-button,
            #daily-challenge-button {

                height: 55px;

                font-size: 14px;

            }


            #player-history-button {

                height: 48px;

                font-size: 12px;

            }


            #home-stats {

                top: 5%;

                right: 50%;

                transform:
                    translateX(50%);

                width: 82vw;

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .home-stat {

                padding: 8px;

            }


            .home-stat-label {

                font-size: 7px;

            }


            .home-stat-value {

                font-size: 14px;

            }


            #countdown {

                width: 110px !important;

                height: 110px !important;

                font-size: 62px !important;

            }


            .answer-area {

                margin-top: 48px;

            }


            .answer-input-wrapper {

                width: 70%;

            }


            .answer-area input {

                width: 100% !important;

            }


            #player-suggestions {

                width: 100% !important;

            }


            .answer-area > #answerButton {

                width: 150px;

                height: 50px;

            }


            .game-over-box {

                padding: 35px 25px 32px;

            }


            .game-over h2 {

                font-size: 28px;

            }


            #final-score {

                font-size: 52px;

            }


            .player-history-summary {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 400px) {

            #home-screen h1 {

                font-size: 25vw;

            }


            .home-buttons {

                width: 78vw;

            }

        }


        @media
        (max-height: 600px)
        and
        (orientation: landscape) {

            #home-screen h1 {

                font-size: 20vh;

            }


            .home-buttons {

                top: 70%;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ANA SAYFA
    ====================================================== -->

    <div id="home-screen">

        <!-- İSTATİSTİKLER -->

        <div id="home-stats">

            <div class="home-stat">

                <span class="home-stat-label">
                    EN YÜKSEK SKOR
                </span>

                <span
                    class="home-stat-value green"
                    id="home-high-score"
                >
                    0
                </span>

            </div>


            <div class="home-stat">

                <span class="home-stat-label">
                    OYNANAN OYUN
                </span>

                <span
                    class="home-stat-value"
                    id="home-games-played"
                >
                    0
                </span>

            </div>


            <div class="home-stat">

                <span class="home-stat-label">
                    DOĞRU SERİ
                </span>

                <span
                    class="home-stat-value green"
                    id="home-correct-streak"
                >
                    0
                </span>

            </div>


            <div class="home-stat">

                <span class="home-stat-label">
                    GÜN SERİSİ
                </span>

                <span
                    class="home-stat-value green"
                    id="home-day-streak"
                >
                    0
                </span>

            </div>

        </div>


        <h1>321</h1>


        <p class="home-subtitle">
            ORTAK FUTBOLCUYU BUL
        </p>


        <div class="home-buttons">

            <button
                id="start-button"
                aria-label="Oyuna Başla"
            >
                OYUNA BAŞLA
            </button>


            <button
                id="daily-challenge-button"
                aria-label="Günlük Challenge"
            >
                GÜNLÜK CHALLENGE
            </button>


            <button
                id="player-history-button"
                aria-label="Futbolcu Arşivi"
            >
                FUTBOLCU ARŞİVİ
            </button>


            <div id="daily-status"></div>

        </div>

    </div>


    <!-- =====================================================
         FUTBOLCU ARŞİVİ
    ====================================================== -->

    <div
        id="player-history-modal"
        aria-hidden="true"
    >

        <div class="player-history-box">

            <div class="player-history-header">

                <div>

                    <h2 class="player-history-title">
                        FUTBOLCU ARŞİVİ
                    </h2>

                    <p class="player-history-subtitle">
                        Daha önce yazdığın futbolcular
                    </p>

                </div>


                <button
                    id="close-player-history"
                    aria-label="Kapat"
                >
                    ×
                </button>

            </div>


            <div class="player-history-summary">

                <div class="history-summary-card">

                    <span class="history-summary-label">
                        FARKLI FUTBOLCU
                    </span>

                    <span
                        class="history-summary-value"
                        id="history-unique-count"
                    >
                        0
                    </span>

                </div>


                <div class="history-summary-card">

                    <span class="history-summary-label">
                        TOPLAM YAZIM
                    </span>

                    <span
                        class="history-summary-value"
                        id="history-total-entries"
                    >
                        0
                    </span>

                </div>


                <div class="history-summary-card">

                    <span class="history-summary-label">
                        EN ÇOK YAZILAN
                    </span>

                    <span
                        class="history-summary-value"
                        id="history-most-written"
                    >
                        -
                    </span>

                </div>

            </div>


            <div id="player-history-list"></div>

        </div>

    </div>


    <!-- =====================================================
         OYUN EKRANI
    ====================================================== -->

    <div id="game-content">

        <header class="game-header">

            <h1>

                <span id="game-mode-title">
                    ORTAK FUTBOLCU
                </span>

            </h1>


            <div
                class="score"
                id="score"
            >
                Puan: 0
            </div>


            <div id="question-number">
                Soru: 0 / 10
            </div>

        </header>


        <div class="timer-container">

            <div id="timer-bar"></div>

        </div>


        <div class="game-area">

            <div
                class="team"
                id="team1"
            >

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        id="team1-logo"
                        src=""
                        alt=""
                    >

                </div>

                <span
                    class="team-name"
                    id="team1-name"
                ></span>

            </div>


            <div class="vs">

                <div id="countdown"></div>

                <div id="vs-text">
                    VS
                </div>

            </div>


            <div
                class="team"
                id="team2"
            >

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        id="team2-logo"
                        src=""
                        alt=""
                    >

                </div>

                <span
                    class="team-name"
                    id="team2-name"
                ></span>

            </div>

        </div>


        <div class="answer-area">

            <div class="answer-input-wrapper">

                <label
                    class="answer-label"
                    for="answerInput"
                >
                    FUTBOLCU ADINI GİR
                </label>


                <input
                    type="text"
                    id="answerInput"
                    placeholder="Ortak futbolcuyu yaz"
                    autocomplete="off"
                    spellcheck="false"
                >


                <div id="player-suggestions"></div>

            </div>


            <button id="answerButton">
                CEVAPLA
            </button>

        </div>


        <div
            id="result"
            aria-live="polite"
        ></div>

    </div>


    <!-- =====================================================
         OYUN BİTİŞ
    ====================================================== -->

    <div
        id="game-over"
        class="game-over"
    >

        <div class="game-over-box">

            <div class="game-over-icon">
                🏆
            </div>


            <h2 id="game-over-title">
                OYUN TAMAMLANDI
            </h2>


            <div class="final-score-label">
                PUAN
            </div>


            <div id="final-score">
                0
            </div>


            <div id="final-message">
                10 soruyu tamamladın!
            </div>


            <button id="restart-button">
                TEKRAR OYNA
            </button>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="players.js"></script>

    <script src="script.js"></script>


</body>

</html>
